# /etc/hostpanel/config.yaml — HostPanel configuration (root:hostpanel 0640; written by install.sh).
# The panel itself listens on loopback only; nginx serves it on panel_port with TLS
# (Let's Encrypt for panel_domain, otherwise a self-signed certificate on the server IP).
listen: 127.0.0.1:8090
panel_domain: ""          # e.g. panel.example.com; empty = https://<server-ip>:<panel_port>
panel_port: 8443
update_repo: zahit5834/hostpanel
data_dir: /var/lib/hostpanel
log_dir: /var/log/hostpanel
root_log_dir: /var/log/hostpanel-root   # root helper logları (ssl-renewals, rclone, update); root:hostpanel 0750
master_key: /etc/hostpanel/master.key
scripts_dir: /opt/hostpanel/scripts
templates_dir: /opt/hostpanel/templates
runtimes_dir: /etc/hostpanel/runtimes
# true when served over HTTPS (nginx in front). false only for SSH tunnel over plain HTTP.
secure_cookies: true
# true when nginx proxies to the panel (honour X-Real-IP from 127.0.0.1 only).
trust_proxy: true
dry_run: false
workers: 1
